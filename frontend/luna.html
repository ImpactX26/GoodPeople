<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUNA · Food Rescue</title>
<link rel="stylesheet" href="/static/luna.css">
</head>
<body>
<span id="modeBadge" class="mode-badge hidden"></span>

<main class="wrap">
  <header class="hero">
    <div class="moon" aria-hidden="true">🌙</div>
    <h1>LUNA</h1>
    <div class="tagline">FOOD RESCUE</div>
  </header>

  <!-- ============ FORM ============ -->
  <form id="form" class="card" novalidate>
    <h2>Upload your surplus food</h2>

    <label id="drop" class="drop" tabindex="0">
      <input id="image" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <div id="dropEmpty" class="drop-empty">
        <div class="drop-icon">📷</div>
        <div class="drop-title">Add a photo of the food</div>
        <div class="drop-sub">Required · tap to choose or drop an image here</div>
      </div>
      <img id="preview" class="preview hidden" alt="Food preview">
    </label>
    <div class="err" id="err-image"></div>

    <div class="field">
      <label for="food_name">Food name</label>
      <input id="food_name" type="text" placeholder="e.g. Vegetable Rice" maxlength="120" autocomplete="off">
      <div class="err" id="err-food_name"></div>
    </div>

    <div class="row">
      <div class="field">
        <label for="food_category">Food category</label>
        <select id="food_category">
          <option value="cooked_meal">Cooked Meal</option>
          <option value="bakery">Bakery</option>
          <option value="raw_produce">Fruits &amp; Vegetables</option>
          <option value="packaged">Packaged Food</option>
          <option value="dairy">Dairy</option>
          <option value="beverages">Beverages</option>
        </select>
        <div class="err" id="err-food_category"></div>
      </div>
      <div class="field">
        <label for="quantity">Quantity</label>
        <div class="suffix"><input id="quantity" type="number" min="1" max="5000" step="1" value="80"><span>portions</span></div>
        <div class="err" id="err-quantity"></div>
      </div>
    </div>

    <div class="field">
      <label for="prepared_at">Prepared at</label>
      <input id="prepared_at" type="datetime-local">
      <div class="err" id="err-prepared_at"></div>
    </div>

    <div class="row">
      <div class="field">
        <label for="storage_method">Storage method</label>
        <select id="storage_method">
          <option value="refrigerated">Refrigerated</option>
          <option value="hot_held">Hot-held</option>
          <option value="room_temp">Room temperature</option>
          <option value="frozen">Frozen</option>
        </select>
        <div class="err" id="err-storage_method"></div>
      </div>
      <div class="field">
        <label for="storage_temperature">Storage temperature</label>
        <div class="suffix"><input id="storage_temperature" type="number" step="0.5" value="4"><span>°C</span></div>
        <div class="err" id="err-storage_temperature"></div>
      </div>
    </div>

    <div class="field">
      <label for="ingredients">Ingredients</label>
      <input id="ingredients" type="text" placeholder="rice, carrot, peas, beans" autocomplete="off">
    </div>

    <div class="field">
      <label for="allergens">Allergens</label>
      <input id="allergens" type="text" placeholder="e.g. nuts, milk — leave empty if none" autocomplete="off">
    </div>

    <button id="submit" class="cta" type="submit">ANALYZE FOOD</button>
    <div class="err center" id="err-form"></div>
  </form>

  <!-- ============ PROGRESS / RESULT ============ -->
  <section id="result" class="card hidden" aria-live="polite">
    <div id="resultIcon" class="result-icon">🌙</div>
    <h2 id="headline" class="headline">Analyzing your food…</h2>
    <p id="message" class="message"></p>

    <ol id="steps" class="steps"></ol>

    <div id="ngoBox" class="ngo-box hidden"></div>
    <div id="scoreBox" class="score-box hidden"><span>Luna Rescue Score</span><b id="score">—</b></div>

    <button id="again" class="cta ghost hidden" type="button">Submit more food</button>
  </section>

  <footer class="foot">Every portion rescued is a meal someone doesn't go without.</footer>
</main>

<script src="/static/luna.js"></script>
</body>
</html>
